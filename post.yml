name: Rased Auto Posting — راصد

on:
  workflow_dispatch:
    inputs:
      job:
        description: "Which job to run?"
        required: true
        default: "auto-post"
        type: choice
        options:
          - auto-post
          - golden-signal
          - track-results
          - weekly-report
      force:
        description: "Force run even if market closed?"
        required: false
        default: "false"
        type: boolean

  schedule:
    - cron: "*/5 7-12 * * 0-4"   # الإشارة العادية أثناء السوق 10:00-15:00 KSA
    - cron: "30 6 * * 0-4"        # الإشارة الذهبية قبل الافتتاح 09:30 KSA
    - cron: "0 11 * * 0-4"        # متابعة أداء الإشارات 14:00 KSA
    - cron: "0 14 * * 4"          # التقرير الأسبوعي الخميس 17:00 KSA

permissions:
  contents: write

env:
  TZ: Asia/Riyadh
  PYTHONIOENCODING: utf-8
  PYTHONUNBUFFERED: "1"

jobs:

  auto-post:
    runs-on: ubuntu-latest
    if: >
      github.event.schedule == '*/5 7-12 * * 0-4' ||
      (github.event_name == 'workflow_dispatch' &&
       github.event.inputs.job == 'auto-post')

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install openai pandas requests pillow arabic-reshaper python-bidi

      - name: Create data folder
        run: mkdir -p data

      - name: Check market status
        id: market
        run: |
          python scripts/is_market_open.py \
            && echo "open=true" >> $GITHUB_OUTPUT \
            || echo "open=false" >> $GITHUB_OUTPUT

      - name: Skip if market closed
        if: steps.market.outputs.open == 'false' && github.event.inputs.force != 'true'
        run: |
          echo "ℹ️ السوق مغلق — انتهاء ناجح بدون نشر"
          exit 0

      - name: Fetch Sahmk market data
        if: steps.market.outputs.open == 'true' || github.event.inputs.force == 'true'
        env:
          API_KEY: ${{ secrets.API_KEY }}
          API_URL: ${{ secrets.API_URL }}
        run: python scripts/market_intelligence.py

      - name: Generate signals
        if: steps.market.outputs.open == 'true' || github.event.inputs.force == 'true'
        env:
          API_KEY: ${{ secrets.API_KEY }}
          API_URL: ${{ secrets.API_URL }}
        run: python scripts/generate_signal.py

      - name: Check if signals exist
        id: signal_check
        if: steps.market.outputs.open == 'true' || github.event.inputs.force == 'true'
        run: |
          python - << 'PY'
          import json, os

          has_signals = False
          count = 0

          try:
              with open("data/signals.json", "r", encoding="utf-8") as f:
                  data = json.load(f)
              signals = data.get("signals", [])
              count = len(signals)
              has_signals = count > 0
          except Exception as e:
              print(f"No valid signals.json: {e}")

          print(f"Signals found: {count}")

          with open(os.environ["GITHUB_OUTPUT"], "a") as out:
              out.write(f"has_signals={'true' if has_signals else 'false'}\n")
              out.write(f"count={count}\n")
          PY

      - name: Stop cleanly if no signals
        if: steps.signal_check.outputs.has_signals != 'true'
        run: |
          echo "ℹ️ لا توجد إشارات اليوم — انتهاء ناجح بدون نشر"
          exit 0

      - name: OpenAI signal review
        if: steps.signal_check.outputs.has_signals == 'true'
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENAI_MODEL: gpt-4o-mini
        run: python scripts/ai_signal_reviewer.py

      - name: Validate signal quality
        id: validate
        if: steps.signal_check.outputs.has_signals == 'true'
        run: python scripts/should_post.py

      - name: Check validated signal count
        id: valid_check
        if: steps.signal_check.outputs.has_signals == 'true'
        run: |
          python - << 'PY'
          import json, os

          count = 0
          try:
              with open("data/validated_signals.json", "r", encoding="utf-8") as f:
                  data = json.load(f)
              count = len(data.get("validated_signals", []))
          except Exception as e:
              print(f"No valid validated_signals.json: {e}")

          print(f"Validated signals: {count}")
          with open(os.environ["GITHUB_OUTPUT"], "a") as out:
              out.write(f"has_valid={'true' if count > 0 else 'false'}\n")
              out.write(f"count={count}\n")
          PY

      - name: Stop cleanly if no valid signal
        if: steps.valid_check.outputs.has_valid != 'true'
        run: |
          echo "ℹ️ لا توجد إشارات مجازة للنشر — انتهاء ناجح بدون نشر"
          exit 0

      - name: Generate post image
        if: steps.valid_check.outputs.has_valid == 'true'
        run: python scripts/generate_post.py data/validated_signals.json output.png

      - name: Post to Telegram
        if: steps.valid_check.outputs.has_valid == 'true'
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python scripts/post_to_telegram.py

      - name: Log published signal
        if: steps.valid_check.outputs.has_valid == 'true'
        run: python scripts/log_published_signal.py

      - name: Commit auto-post updates
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/ output.png 2>/dev/null || true
          git diff --cached --quiet || git commit -m "📊 راصد — تحديث إشارة $(date +'%H:%M')"
          git push || true
        continue-on-error: true


  golden-signal:
    runs-on: ubuntu-latest
    if: >
      github.event.schedule == '30 6 * * 0-4' ||
      (github.event_name == 'workflow_dispatch' &&
       github.event.inputs.job == 'golden-signal')

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install openai pandas requests pillow arabic-reshaper python-bidi ta

      - name: Create data folder
        run: mkdir -p data

      - name: Generate golden signal before market open
        env:
          API_KEY: ${{ secrets.API_KEY }}
          API_URL: ${{ secrets.API_URL }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENAI_MODEL: gpt-4o-mini
        run: python scripts/golden_signal_analysis.py || true

      - name: Check golden signal count
        id: golden_check
        run: |
          python - << 'PY'
          import json, os

          count = 0
          try:
              with open("data/golden_signals.json", "r", encoding="utf-8") as f:
                  data = json.load(f)
              if isinstance(data, list):
                  count = len(data)
              elif isinstance(data, dict):
                  count = len(data.get("golden_signals", data.get("signals", [])))
          except Exception as e:
              print(f"No valid golden_signals.json: {e}")

          print(f"Golden signals found: {count}")
          with open(os.environ["GITHUB_OUTPUT"], "a") as out:
              out.write(f"found={'true' if count > 0 else 'false'}\n")
              out.write(f"count={count}\n")
          PY

      - name: Stop cleanly if no golden signal
        if: steps.golden_check.outputs.found != 'true'
        run: |
          echo "ℹ️ لا توجد إشارة ذهبية قبل الافتتاح — انتهاء ناجح بدون نشر"
          exit 0

      - name: Generate golden image
        if: steps.golden_check.outputs.found == 'true'
        run: python scripts/generate_golden_post.py data/golden_signals.json golden_output.png

      - name: Post golden signal to Telegram
        if: steps.golden_check.outputs.found == 'true'
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python scripts/post_golden_signal.py

      - name: Log published golden signal
        if: steps.golden_check.outputs.found == 'true'
        run: python scripts/log_published_signal.py

      - name: Commit golden updates
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/ golden_output.png 2>/dev/null || true
          git diff --cached --quiet || git commit -m "👑 راصد — إشارة ذهبية $(date +'%H:%M')"
          git push || true
        continue-on-error: true


  track-results:
    runs-on: ubuntu-latest
    if: >
      github.event.schedule == '0 11 * * 0-4' ||
      (github.event_name == 'workflow_dispatch' &&
       github.event.inputs.job == 'track-results')

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pandas requests

      - name: Track signal performance
        env:
          API_KEY: ${{ secrets.API_KEY }}
          API_URL: ${{ secrets.API_URL }}
        run: python scripts/track_signal_performance.py

      - name: Commit performance updates
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/ 2>/dev/null || true
          git diff --cached --quiet || git commit -m "📈 راصد — تحديث أداء الإشارات $(date +'%H:%M')"
          git push || true
        continue-on-error: true


  weekly-report:
    runs-on: ubuntu-latest
    if: >
      github.event.schedule == '0 14 * * 4' ||
      (github.event_name == 'workflow_dispatch' &&
       github.event.inputs.job == 'weekly-report')

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pandas requests

      - name: Update performance before weekly report
        env:
          API_KEY: ${{ secrets.API_KEY }}
          API_URL: ${{ secrets.API_URL }}
        run: python scripts/track_signal_performance.py

      - name: Generate weekly report
        run: python scripts/weekly_report.py

      - name: Post weekly report to Telegram
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python scripts/post_weekly_report.py

      - name: Commit weekly report updates
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/ docs/ 2>/dev/null || true
          git diff --cached --quiet || git commit -m "📊 راصد — التقرير الأسبوعي $(date +'%H:%M')"
          git push || true
        continue-on-error: true

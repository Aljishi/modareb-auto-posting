name: 📊 Weekly Performance Report

on:
  # التشغيل اليدوي
  workflow_dispatch:
  
  # التشغيل عند push لبيانات أساسية
  push:
    paths:
      - 'data/fundamentals.json'
      - 'data/signals_log.csv'
      - 'scripts/weekly_report.py'
    branches:
      - main
  
  # الجدولة الأسبوعية (الخميس 3:30 م)
  schedule:
    - cron: '30 12 * * 4'  # 3:30 PM Riyadh time on Thursday

jobs:
  weekly-report:
    name: 📈 Generate Weekly Report
    runs-on: ubuntu-latest
    timeout-minutes: 20
    
    steps:
      - name: 📥 Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      
      - name: 🐍 Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'
      
      - name: 📦 Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pandas numpy matplotlib seaborn requests
      
      - name: 📁 Create directories
        run: |
          mkdir -p data
          mkdir -p docs/reports
          mkdir -p assets/charts
      
      - name: 📊 Load Fundamentals Data
        id: fundamentals
        run: |
          echo "📊 Loading fundamentals data..."
          if [ -f "data/fundamentals.json" ]; then
            echo "data_exists=true" >> $GITHUB_OUTPUT
          else
            echo "data_exists=false" >> $GITHUB_OUTPUT
            echo "⚠️ No fundamentals data found"
          fi
      
      - name: 📈 Generate Weekly Statistics
        run: |
          echo "📈 Generating weekly performance statistics..."
          python scripts/weekly_report.py
        env:
          API_KEY: ${{ secrets.API_KEY }}
          API_URL: ${{ secrets.API_URL }}
          PYTHONUTF8: 1
      
      - name: 📊 Create Performance Charts
        run: |
          echo "📊 Creating performance visualizations..."
          python -c "
import pandas as pd
import matplotlib.pyplot as plt
import matplotlib
matplotlib.use('Agg')
import os

# إعدادات الخط للعربية
plt.rcParams['font.sans-serif'] = ['DejaVu Sans']
plt.rcParams['axes.unicode_minus'] = False

# قراءة السجل
if os.path.exists('data/signals_log.csv'):
    df = pd.read_csv('data/signals_log.csv')
    
    if len(df) > 0:
        # رسم توزيع النقاط (Scores)
        fig, axes = plt.subplots(2, 2, figsize=(12, 10))
        fig.suptitle('Weekly Performance Overview', fontsize=16, fontweight='bold')
        
        # 1. Distribution of scores
        axes[0, 0].hist(df['score'], bins=10, color='#3498DB', edgecolor='black', alpha=0.7)
        axes[0, 0].set_title('Score Distribution')
        axes[0, 0].set_xlabel('Score')
        axes[0, 0].set_ylabel('Frequency')
        
        # 2. RS Rank distribution
        if 'rs_rank' in df.columns:
            axes[0, 1].hist(df['rs_rank'], bins=10, color='#2ECC71', edgecolor='black', alpha=0.7)
            axes[0, 1].set_title('RS Rank Distribution')
            axes[0, 1].set_xlabel('RS Rank')
            axes[0, 1].set_ylabel('Frequency')
        
        # 3. Signals by sector (if available)
        if 'sector' in df.columns:
            sector_counts = df['sector'].value_counts().head(5)
            axes[1, 0].barh(sector_counts.index, sector_counts.values, color='#D4AF37')
            axes[1, 0].set_title('Top 5 Sectors')
            axes[1, 0].set_xlabel('Number of Signals')
        
        # 4. Success rate over time (if we have outcome data)
        axes[1, 1].text(0.5, 0.5, f'Total Signals: {len(df)}\nAvg Score: {df[\"score\"].mean():.1f}\nAvg RS Rank: {df.get(\"rs_rank\", pd.Series([0]*len(df))).mean():.1f}', 
                       horizontalalignment='center', verticalalignment='center', 
                       fontsize=14, transform=axes[1, 1].transAxes)
        axes[1, 1].axis('off')
        
        plt.tight_layout()
        plt.savefig('assets/charts/weekly_performance.png', dpi=150, bbox_inches='tight')
        plt.close()
        print('✅ Charts saved to assets/charts/weekly_performance.png')
    else:
        print('⚠️ No data to visualize')
else:
    print('⚠️ No signals log found')
"
      
      - name: 📝 Generate HTML Report
        run: |
          echo "📝 Generating HTML report..."
          python -c "
import pandas as pd
import json
from datetime import datetime
import os

# قراءة البيانات
stats = {}
if os.path.exists('data/performance_stats.json'):
    with open('data/performance_stats.json', 'r') as f:
        stats = json.load(f)

df = pd.read_csv('data/signals_log.csv') if os.path.exists('data/signals_log.csv') else pd.DataFrame()

# إنشاء تقرير HTML
html = f'''<!DOCTYPE html>
<html dir=\"rtl\" lang=\"ar\">
<head>
    <meta charset=\"UTF-8\">
    <meta name=\"viewport\" content=\"width=device-width, initial-scale=1.0\">
    <title>راصد - التقرير الأسبوعي</title>
    <style>
        body {{
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #0B1120 0%, #1A1A2E 100%);
            color: #fff;
            margin: 0;
            padding: 20px;
        }}
        .container {{
            max-width: 1200px;
            margin: 0 auto;
            background: rgba(255,255,255,0.05);
            border-radius: 15px;
            padding: 30px;
            backdrop-filter: blur(10px);
        }}
        h1 {{
            text-align: center;
            color: #D4AF37;
            font-size: 2.5em;
            margin-bottom: 10px;
        }}
        .subtitle {{
            text-align: center;
            color: #95A5A6;
            margin-bottom: 40px;
        }}
        .stats-grid {{
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 20px;
            margin: 30px 0;
        }}
        .stat-card {{
            background: linear-gradient(135deg, #151E32 0%, #1A2744 100%);
            padding: 25px;
            border-radius: 10px;
            text-align: center;
            border: 2px solid #2C3E50;
        }}
        .stat-value {{
            font-size: 2.5em;
            font-weight: bold;
            color: #3498DB;
            margin: 10px 0;
        }}
        .stat-label {{
            color: #95A5A6;
            font-size: 0.9em;
        }}
        .chart-container {{
            margin: 30px 0;
            text-align: center;
        }}
        .chart-container img {{
            max-width: 100%;
            border-radius: 10px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.3);
        }}
        .footer {{
            text-align: center;
            margin-top: 40px;
            padding-top: 20px;
            border-top: 1px solid #2C3E50;
            color: #95A5A6;
        }}
    </style>
</head>
<body>
    <div class=\"container\">
        <h1>👁️ راصد</h1>
        <div class=\"subtitle\">التقرير الأسبوعي للأداء - Weekly Performance Report</div>
        
        <div class=\"stats-grid\">
            <div class=\"stat-card\">
                <div class=\"stat-label\">إجمالي الإشارات</div>
                <div class=\"stat-value\">{stats.get('total_signals', len(df))}</div>
            </div>
            <div class=\"stat-card\">
                <div class=\"stat-label\">متوسط النقاط</div>
                <div class=\"stat-value\">{stats.get('avg_score', df['score'].mean() if len(df) > 0 else 0):.1f}</div>
            </div>
            <div class=\"stat-card\">
                <div class=\"stat-label\">متوسط RS Rank</div>
                <div class=\"stat-value\">{df.get('rs_rank', pd.Series([0])).mean() if len(df) > 0 else 0:.1f}</div>
            </div>
            <div class=\"stat-card\">
                <div class=\"stat-label\">متوسط R:R</div>
                <div class=\"stat-value\">{stats.get('avg_rr', 0):.2f}</div>
            </div>
        </div>
        
        <div class=\"chart-container\">
            <h2 style=\"color: #D4AF37;\">📊 الأداء الأسبوعي</h2>
            <img src=\"../assets/charts/weekly_performance.png\" alt=\"Weekly Performance Chart\">
        </div>
        
        <div class=\"footer\">
            <p>تم التحديث: {datetime.now().strftime('%Y-%m-%d %H:%M')}</p>
            <p>👁️ راصد | عينك على الفرص</p>
        </div>
    </div>
</body>
</html>
'''

with open('docs/reports/weekly_report.html', 'w', encoding='utf-8') as f:
    f.write(html)

print('✅ HTML report saved to docs/reports/weekly_report.html')
"
      
      - name: 📤 Commit and push reports
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add docs/reports/ assets/charts/ data/performance_stats.json
          git commit -m "📊 Weekly report - $(date +'%Y-%m-%d')" || echo "No changes to commit"
          git push
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      
      - name: 📸 Upload Reports Artifact
        uses: actions/upload-artifact@v4
        with:
          name: weekly-report
          path: |
            docs/reports/
            assets/charts/
            data/performance_stats.json
          retention-days: 30
      
      - name: ✅ Job Summary
        if: always()
        run: |
          echo "## 📊 Weekly Report Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Status:** ${{ job.status }}" >> $GITHUB_STEP_SUMMARY
          echo "**Generated:** $(date)" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### 📁 Generated Files:" >> $GITHUB_STEP_SUMMARY
          echo "- 📊 Performance charts" >> $GITHUB_STEP_SUMMARY
          echo "- 📝 HTML report" >> $GITHUB_STEP_SUMMARY
          echo "- 📈 Statistics JSON" >> $GITHUB_STEP_SUMMARY

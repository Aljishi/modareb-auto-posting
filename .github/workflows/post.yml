name: Rased Auto Posting

on:
  workflow_dispatch:
    inputs:
      force:
        description: "Run even if Saudi market is closed?"
        required: false
        default: "false"
        type: choice
        options:
          - "false"
          - "true"

  # Saudi Exchange continuous trading: Sunday-Thursday 10:00-15:00 KSA.
  # GitHub cron uses UTC. KSA = UTC+3, so 07:00-11:55 UTC = 10:00-14:55 KSA.
  schedule:
    - cron: "*/5 7-11 * * 0-4"

permissions:
  contents: write

env:
  TZ: Asia/Riyadh
  PYTHONIOENCODING: utf-8
  MARKET_FORCE: ${{ github.event.inputs.force || 'false' }}

jobs:
  post:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install requirements
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Check Saudi market hours
        id: market
        continue-on-error: true
        run: |
          python scripts/is_market_open.py

      - name: Stop if market is closed
        if: steps.market.outcome == 'failure'
        run: |
          echo "Saudi market is closed. Skipping posting."
          exit 0

      - name: Fetch/update signal data
        run: |
          if [ -f scripts/fetch_api_data.py ]; then
            python scripts/fetch_api_data.py
          else
            echo "scripts/fetch_api_data.py not found, using existing data/daily.json"
          fi

      - name: Validate signal before posting
        run: |
          if [ -f scripts/should_post.py ]; then
            python scripts/should_post.py
          else
            echo "scripts/should_post.py not found, skipping validation"
          fi

      - name: Generate normal post image
        run: |
          python scripts/generate_post.py data/daily.json output.png

      - name: Generate golden post image when applicable
        run: |
          if [ -f scripts/generate_golden_post.py ]; then
            python scripts/generate_golden_post.py data/daily.json golden_output.png
          fi

      - name: 📢 Post to Telegram
        # ✅ هذه الخطوة ضرورية لربط الأسرار بالمتغيرات البيئية
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          echo "🚀 Starting Telegram Post..."
          python scripts/post_to_telegram.py

      - name: Post to Instagram
        env:
          FB_PAGE_TOKEN: ${{ secrets.FB_PAGE_TOKEN }}
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
        run: |
          if [ -f scripts/post_to_instagram.py ]; then
            python scripts/post_to_instagram.py
          else
            echo "scripts/post_to_instagram.py not found"
          fi

      - name: Commit generated files
        if: always()
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          git add output.png golden_output.png data/*.json || true
          git diff --cached --quiet || git commit -m "Update Rased generated posts"
          git push || true

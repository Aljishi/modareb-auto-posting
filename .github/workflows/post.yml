name: Rased Auto Posting

on:
  workflow_dispatch:
    inputs:
      job:
        description: "Which job to run?"
        required: false
        default: "all"
        type: choice
        options:
          - "all"
          - "auto-post"
          - "track-results"
          - "weekly-report"
          - "golden-signal"
      force:
        description: "Force run even if market closed?"
        required: false
        default: "false"
        type: boolean

  schedule:
    # Auto Post - كل 5 دقائق أثناء السوق (10:00-14:55 KSA = 07:00-11:55 UTC)
    - cron: "*/5 7-11 * * 0-4"
    # Track Results - كل ساعة
    - cron: "0 * * * *"
    # Weekly Report - الخميس 5 مساءً KSA = 2 PM UTC
    - cron: "0 14 * * 4"
    # Golden Signal - يومياً 4 مساءً KSA = 1 PM UTC
    - cron: "0 13 * * 0-4"

permissions:
  contents: write

env:
  TZ: Asia/Riyadh
  PYTHONIOENCODING: utf-8
  PYTHONUNBUFFERED: "1"

jobs:
  # ─────────────────────────────────────────────────────
  # Job 1: Auto Post (Daily Signals During Market)
  # ─────────────────────────────────────────────────────
  auto-post:
    runs-on: ubuntu-latest
    if: |
      github.event.schedule == '*/5 7-11 * * 0-4' ||
      (github.event_name == 'workflow_dispatch' &&
      (github.event.inputs.job == 'all' || github.event.inputs.job == 'auto-post'))
    
    steps:
      - uses: actions/checkout@v4
      
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      
      - name: Check market status
        id: market
        run: |
          echo "🕐 Checking Saudi market status..."
          if python scripts/is_market_open.py; then
            echo "open=true" >> $GITHUB_OUTPUT
          else
            echo "open=false" >> $GITHUB_OUTPUT
          fi
      
      - name: Skip if market closed
        if: steps.market.outputs.open == 'false' && github.event.inputs.force != 'true'
        run: |
          echo "⚠️ Market closed - skipping auto-post"
          exit 0
      
      - name: Ensure data directory exists
        run: mkdir -p data
      
      - name: Fetch market intelligence
        if: steps.market.outputs.open == 'true' || github.event.inputs.force == 'true'
        run: |
          echo "🧠 Fetching advanced market intelligence..."
          python scripts/market_intelligence.py || \
          python scripts/fetch_api_data.py || \
          (echo "⚠️ Using cached data" && ls -la data/)
      
      - name: Generate signal
        if: steps.market.outputs.open == 'true' || github.event.inputs.force == 'true'
        run: python scripts/generate_signal.py
      
      - name: Validate signal
        if: steps.market.outputs.open == 'true' || github.event.inputs.force == 'true'
        run: python scripts/should_post.py
      
      - name: Generate post image
        if: steps.market.outputs.open == 'true' || github.event.inputs.force == 'true'
        run: |
          if [ -f data/validated_signals.json ]; then
            python scripts/generate_post.py data/validated_signals.json output.png
          elif [ -f data/signals.json ]; then
            python scripts/generate_post.py data/signals.json output.png
          else
            echo "⚠️ No signals found"
          fi
      
      - name: Post to Telegram
        if: steps.market.outputs.open == 'true' || github.event.inputs.force == 'true'
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python scripts/post_to_telegram.py

  # ─────────────────────────────────────────────────────
  # Job 2: Track Results (Hourly)
  # ─────────────────────────────────────────────────────
  track-results:
    runs-on: ubuntu-latest
    if: |
      github.event.schedule == '0 * * * *' ||
      (github.event_name == 'workflow_dispatch' &&
      (github.event.inputs.job == 'all' || github.event.inputs.job == 'track-results'))
    
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -r requirements.txt
      - run: python scripts/track_results.py || echo "Tracking skipped"
      - run: python scripts/update_track_record.py || echo "Update skipped"
      - run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add docs/index.html data/*.json 2>/dev/null || true
          git diff --cached --quiet || git commit -m "Update track record"
          git push || true

  # ─────────────────────────────────────────────────────
  # Job 3: Weekly Report (Thursday 5 PM KSA ONLY)
  # ─────────────────────────────────────────────────────
  weekly-report:
    runs-on: ubuntu-latest
    # ✅ هذا الشرط يمنع التشغيل إلا في الوقت المحدد أو عند الطلب الصريح
    if: |
      github.event.schedule == '0 14 * * 4' ||
      (github.event_name == 'workflow_dispatch' &&
      github.event.inputs.job == 'weekly-report')
    
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -r requirements.txt
      - run: python scripts/weekly_report.py || echo "Report skipped"
      - name: Post report
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python scripts/post_weekly_report.py || echo "Post skipped"

  # ─────────────────────────────────────────────────────
  # Job 4: Golden Signal (Daily 4 PM KSA - After Market)
  # ─────────────────────────────────────────────────────
  golden-signal:
    runs-on: ubuntu-latest
    continue-on-error: true
    if: |
      github.event.schedule == '0 13 * * 0-4' ||
      (github.event_name == 'workflow_dispatch' &&
      (github.event.inputs.job == 'all' || github.event.inputs.job == 'golden-signal'))
    
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -r requirements.txt pandas ta
      - run: mkdir -p data
      - run: |
          if [ ! -f data/daily.json ]; then
            echo '{"stocks": []}' > data/daily.json
          fi
      - run: python scripts/golden_signal_analysis.py || echo "ℹ️ No golden signals"
      - name: Check golden signal
        id: golden
        run: |
          if [ -f data/golden_signals.json ] && [ "$(jq length data/golden_signals.json 2>/dev/null || echo 0)" -gt 0 ]; then
            echo "found=true" >> $GITHUB_OUTPUT
          else
            echo "found=false" >> $GITHUB_OUTPUT
          fi
      - name: Generate golden post
        if: steps.golden.outputs.found == 'true'
        run: python scripts/generate_golden_post.py data/golden_signals.json golden_output.png
      - name: Post to Telegram
        if: steps.golden.outputs.found == 'true'
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python scripts/post_golden_signal.py


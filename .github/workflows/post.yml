name: Rased Auto Posting — راصد

on:
  workflow_dispatch:
    inputs:
      job:
        description: "Which job to run?"
        required: false
        default: "all"
        type: choice
        options: ["all", "auto-post", "track-results", "weekly-report", "golden-signal"]
      force:
        description: "Force run even if market closed?"
        required: false
        default: "false"
        type: boolean

  schedule:
    - cron: "*/5 7-12 * * 0-4"   # إشارة يومية كل 5 دقائق أثناء السوق
    - cron: "0 10-12 * * 0-4"     # متابعة النتائج
    - cron: "0 14 * * 4"          # تقرير أسبوعي كل خميس
    - cron: "30 6 * * 0-4"        # الإشارة الذهبية قبل فتح السوق

permissions:
  contents: write

env:
  TZ: Asia/Riyadh
  PYTHONIOENCODING: utf-8
  PYTHONUNBUFFERED: "1"
  API_URL: https://app.sahmk.sa/api/v1
  MAX_HOLD_DAYS: "7"
  MIN_HISTORY_BARS: "30"

jobs:

  auto-post:
    runs-on: ubuntu-latest
    if: >
      github.event.schedule == '*/5 7-12 * * 0-4' ||
      (github.event_name == 'workflow_dispatch' &&
       (github.event.inputs.job == 'all' || github.event.inputs.job == 'auto-post'))

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          pip install openai arabic-reshaper==3.0.0 python-bidi==0.4.2 --force-reinstall
          python -c "import arabic_reshaper; from bidi.algorithm import get_display; print('✅ Arabic OK')"

      - name: Check market status
        id: market
        run: |
          python scripts/is_market_open.py \
            && echo "open=true"  >> $GITHUB_OUTPUT \
            || echo "open=false" >> $GITHUB_OUTPUT

      - name: Skip if market closed
        if: steps.market.outputs.open == 'false' && github.event.inputs.force != 'true'
        run: |
          echo "⚠️ السوق مغلق — تم التخطي"
          exit 0

      - run: mkdir -p data

      - name: Fetch Sahmk market data
        if: steps.market.outputs.open == 'true' || github.event.inputs.force == 'true'
        env:
          API_KEY: ${{ secrets.API_KEY }}
        run: python scripts/market_intelligence.py

      - name: Generate Sahmk historical signals
        if: steps.market.outputs.open == 'true' || github.event.inputs.force == 'true'
        env:
          API_KEY: ${{ secrets.API_KEY }}
        run: python scripts/generate_signal.py

      - name: OpenAI signal review
        if: steps.market.outputs.open == 'true' || github.event.inputs.force == 'true'
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENAI_MODEL: gpt-4o-mini
        run: python scripts/ai_signal_reviewer.py

      - name: Validate signal quality
        id: validate
        if: steps.market.outputs.open == 'true' || github.event.inputs.force == 'true'
        run: python scripts/should_post.py

      - name: Generate post image
        if: >
          steps.validate.outcome == 'success' &&
          (steps.market.outputs.open == 'true' || github.event.inputs.force == 'true')
        run: python scripts/generate_post.py data/validated_signals.json output.png

      - name: Post to Telegram
        if: >
          steps.validate.outcome == 'success' &&
          (steps.market.outputs.open == 'true' || github.event.inputs.force == 'true')
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python scripts/post_to_telegram.py

      - name: Commit data
        if: steps.validate.outcome == 'success'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/ || true
          git diff --cached --quiet || git commit -m "📊 إشارة — $(date +'%H:%M')"
          git push || true
        continue-on-error: true

  track-results:
    runs-on: ubuntu-latest
    if: >
      github.event.schedule == '0 10-12 * * 0-4' ||
      (github.event_name == 'workflow_dispatch' &&
       (github.event.inputs.job == 'all' || github.event.inputs.job == 'track-results'))

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Check targets
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          API_KEY: ${{ secrets.API_KEY }}
        run: python scripts/track_results.py
      - name: Update track record
        run: python scripts/update_track_record.py || echo "⚠️ تخطي"
        continue-on-error: true
      - name: Commit results
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/ docs/ 2>/dev/null || true
          git diff --cached --quiet || git commit -m "📈 نتائج — $(date +'%H:%M')"
          git push || true
        continue-on-error: true

  weekly-report:
    runs-on: ubuntu-latest
    if: >
      github.event.schedule == '0 14 * * 4' ||
      (github.event_name == 'workflow_dispatch' &&
       github.event.inputs.job == 'weekly-report')
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Generate weekly report
        run: python scripts/weekly_report.py
      - name: Post weekly report to Telegram
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python scripts/post_weekly_report.py
        continue-on-error: true

  golden-signal:
    runs-on: ubuntu-latest
    if: >
      github.event.schedule == '30 6 * * 0-4' ||
      (github.event_name == 'workflow_dispatch' &&
       (github.event.inputs.job == 'all' || github.event.inputs.job == 'golden-signal'))
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: |
          pip install -r requirements.txt pandas ta
          pip install arabic-reshaper==3.0.0 python-bidi==0.4.2 --force-reinstall
      - run: mkdir -p data
      - name: Fetch market data for golden analysis
        env:
          API_KEY: ${{ secrets.API_KEY }}
        run: python scripts/market_intelligence.py
      - name: Golden signal analysis
        id: analysis
        run: python scripts/golden_signal_analysis.py || echo "ℹ️ لا إشارات ذهبية"
        continue-on-error: true
      - name: Check golden signal count
        id: golden
        run: |
          COUNT=$(python -c "import json; import pathlib; p=pathlib.Path('data/golden_signals.json'); print(len(json.load(open(p,encoding='utf-8'))) if p.exists() else 0)")
          echo "count=$COUNT" >> $GITHUB_OUTPUT
          echo "found=$([ $COUNT -gt 0 ] && echo true || echo false)" >> $GITHUB_OUTPUT
          echo "📊 إشارات ذهبية موجودة: $COUNT"
      - name: Generate golden image
        if: steps.golden.outputs.found == 'true'
        run: python scripts/generate_golden_post.py data/golden_signals.json golden_output.png
      - name: Post golden signal to Telegram
        if: steps.golden.outputs.found == 'true'
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python scripts/post_golden_signal.py
      - name: Commit golden signal data
        if: steps.golden.outputs.found == 'true'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/golden_signals.json || true
          git diff --cached --quiet || git commit -m "🌟 إشارة ذهبية — $(date +'%H:%M')"
          git push || true
        continue-on-error: true

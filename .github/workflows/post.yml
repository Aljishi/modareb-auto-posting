name: Rased Auto Posting — راصد

on:
  workflow_dispatch:
    inputs:
      job:
        description: "Which job to run?"
        required: false
        default: "all"
        type: choice
        options: ["all", "auto-post", "track-results", "weekly-report", "golden-signal"]
      force:
        description: "Force run even if market closed?"
        required: false
        default: "false"
        type: boolean

  schedule:
    - cron: "*/5 7-12 * * 0-4"   # الإشارة اليومية أثناء السوق 10:00-15:00 KSA
    - cron: "0 10-12 * * 0-4"     # متابعة النتائج
    - cron: "0 14 * * 4"          # التقرير الأسبوعي الخميس 5:00 PM KSA
    - cron: "30 6 * * 0-4"        # الإشارة الذهبية قبل الافتتاح 9:30 AM KSA

permissions:
  contents: write

env:
  TZ: Asia/Riyadh
  PYTHONIOENCODING: utf-8
  PYTHONUNBUFFERED: "1"

jobs:

  auto-post:
    runs-on: ubuntu-latest
    if: >
      github.event.schedule == '*/5 7-12 * * 0-4' ||
      (github.event_name == 'workflow_dispatch' &&
       (github.event.inputs.job == 'all' || github.event.inputs.job == 'auto-post'))

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          pip install openai arabic-reshaper==3.0.0 python-bidi==0.4.2 --force-reinstall

      - name: Check market status
        id: market
        run: |
          python scripts/is_market_open.py \
            && echo "open=true"  >> $GITHUB_OUTPUT \
            || echo "open=false" >> $GITHUB_OUTPUT

      - name: Skip if market closed
        if: steps.market.outputs.open == 'false' && github.event.inputs.force != 'true'
        run: |
          echo "⚠️ السوق مغلق — تم التخطي بدون خطأ"
          exit 0

      - name: Prepare data folder
        run: mkdir -p data

      - name: Fetch Sahmk market data
        if: steps.market.outputs.open == 'true' || github.event.inputs.force == 'true'
        env:
          API_KEY: ${{ secrets.API_KEY }}
          API_URL: ${{ secrets.API_URL }}
        run: python scripts/market_intelligence.py

      - name: Generate Sahmk historical signals
        if: steps.market.outputs.open == 'true' || github.event.inputs.force == 'true'
        env:
          API_KEY: ${{ secrets.API_KEY }}
          API_URL: ${{ secrets.API_URL }}
        run: python scripts/generate_signal.py

      - name: Check signals count
        id: signals
        if: steps.market.outputs.open == 'true' || github.event.inputs.force == 'true'
        run: |
          python - << 'PY'
          import json, os

          has_signals = False

          try:
              with open("data/signals.json", "r", encoding="utf-8") as f:
                  data = json.load(f)

              signals = data.get("signals", [])
              has_signals = len(signals) > 0
              print(f"Signals found: {len(signals)}")

          except Exception as e:
              print(f"No signals file or invalid file: {e}")
              has_signals = False

          with open(os.environ["GITHUB_OUTPUT"], "a") as out:
              out.write(f"has_signals={'true' if has_signals else 'false'}\n")
          PY

      - name: Stop cleanly if no signals
        if: steps.signals.outputs.has_signals != 'true'
        run: |
          echo "ℹ️ لا توجد إشارات اليوم — انتهاء ناجح بدون نشر"
          exit 0

      - name: OpenAI signal review
        if: steps.signals.outputs.has_signals == 'true'
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENAI_MODEL: gpt-4o-mini
        run: python scripts/ai_signal_reviewer.py

      - name: Validate signal quality
        id: validate
        if: steps.signals.outputs.has_signals == 'true'
        run: python scripts/should_post.py

      - name: Generate post image
        if: steps.validate.outcome == 'success'
        run: python scripts/generate_post.py data/validated_signals.json output.png

      - name: Post to Telegram
        if: steps.validate.outcome == 'success'
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python scripts/post_to_telegram.py

      - name: Commit data
        if: always()
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/ output.png 2>/dev/null || true
          git diff --cached --quiet || git commit -m "📊 راصد — تحديث بيانات $(date +'%H:%M')"
          git push || true
        continue-on-error: true


  golden-signal:
    runs-on: ubuntu-latest
    if: >
      github.event.schedule == '30 6 * * 0-4' ||
      (github.event_name == 'workflow_dispatch' &&
       (github.event.inputs.job == 'all' || github.event.inputs.job == 'golden-signal'))

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          pip install pandas ta openai arabic-reshaper==3.0.0 python-bidi==0.4.2 --force-reinstall

      - name: Prepare data folder
        run: mkdir -p data

      - name: Generate golden signal before market open
        env:
          API_KEY: ${{ secrets.API_KEY }}
          API_URL: ${{ secrets.API_URL }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENAI_MODEL: gpt-4o-mini
        run: |
          python scripts/golden_signal_analysis.py || true

      - name: Check golden signal count
        id: golden
        run: |
          python - << 'PY'
          import json, os

          count = 0

          try:
              with open("data/golden_signals.json", "r", encoding="utf-8") as f:
                  data = json.load(f)

              if isinstance(data, list):
                  count = len(data)
              elif isinstance(data, dict):
                  count = len(data.get("golden_signals", data.get("signals", [])))

          except Exception as e:
              print(f"No golden signals file or invalid file: {e}")
              count = 0

          print(f"Golden signals found: {count}")

          with open(os.environ["GITHUB_OUTPUT"], "a") as out:
              out.write(f"found={'true' if count > 0 else 'false'}\n")
              out.write(f"count={count}\n")
          PY

      - name: Stop cleanly if no golden signal
        if: steps.golden.outputs.found != 'true'
        run: |
          echo "ℹ️ لا توجد إشارة ذهبية قبل الافتتاح — انتهاء ناجح بدون نشر"
          exit 0

      - name: Generate golden image
        if: steps.golden.outputs.found == 'true'
        run: python scripts/generate_golden_post.py data/golden_signals.json golden_output.png

      - name: Post golden signal to Telegram
        if: steps.golden.outputs.found == 'true'
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python scripts/post_golden_signal.py

      - name: Commit golden signal data
        if: always()
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/golden_signals.json golden_output.png 2>/dev/null || true
          git diff --cached --quiet || git commit -m "👑 راصد — إشارة ذهبية $(date +'%H:%M')"
          git push || true
        continue-on-error: true


  track-results:
    runs-on: ubuntu-latest
    if: >
      github.event.schedule == '0 10-12 * * 0-4' ||
      (github.event_name == 'workflow_dispatch' &&
       (github.event.inputs.job == 'all' || github.event.inputs.job == 'track-results'))

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Check targets
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          API_KEY: ${{ secrets.API_KEY }}
          API_URL: ${{ secrets.API_URL }}
        run: python scripts/track_results.py || true

      - name: Update track record
        run: python scripts/update_track_record.py || true

      - name: Commit results
        if: always()
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/ docs/ 2>/dev/null || true
          git diff --cached --quiet || git commit -m "📈 راصد — تحديث النتائج $(date +'%H:%M')"
          git push || true
        continue-on-error: true


  weekly-report:
    runs-on: ubuntu-latest
    if: >
      github.event.schedule == '0 14 * * 4' ||
      (github.event_name == 'workflow_dispatch' &&
       github.event.inputs.job == 'weekly-report')

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Generate weekly report
        run: python scripts/weekly_report.py || true

      - name: Post weekly report to Telegram
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python scripts/post_weekly_report.py || true
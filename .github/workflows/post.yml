name: Rased Auto Posting

on:
  workflow_dispatch:
    inputs:
      force:
        description: "Run even if Saudi market is closed?"
        required: false
        default: "false"
        type: choice
        options:
          - "false"
          - "true"
  
  schedule:
    # Saudi market: Sun-Thu 10:00-15:00 KSA = UTC 07:00-11:55
    - cron: "*/5 7-11 * * 0-4"

permissions:
  contents: write

env:
  TZ: Asia/Riyadh
  PYTHONIOENCODING: utf-8

jobs:
  post:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install requirements
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Check Saudi market hours
        id: market
        run: |
          if python scripts/is_market_open.py; then
            echo "market_open=true" >> $GITHUB_OUTPUT
          else
            echo "market_open=false" >> $GITHUB_OUTPUT
            echo "⚠️ Market closed, skipping posting"
          fi

      - name: Skip if market closed
        if: steps.market.outputs.market_open == 'false' && github.event.inputs.force != 'true'
        run: |
          echo "✅ Saudi market is closed. Workflow stopped gracefully."
          exit 0

      - name: Fetch/update signal data
        if: steps.market.outputs.market_open == 'true' || github.event.inputs.force == 'true'
        run: |
          python scripts/fetch_api_data.py || echo "Using existing data"

      - name: Validate signal before posting
        if: steps.market.outputs.market_open == 'true' || github.event.inputs.force == 'true'
        run: |
          python scripts/should_post.py || echo "No valid signal today"

      - name: Generate normal post image
        if: steps.market.outputs.market_open == 'true' || github.event.inputs.force == 'true'
        run: |
          python scripts/generate_post.py data/daily.json output.png

      - name: Generate golden post image when applicable
        if: steps.market.outputs.market_open == 'true' || github.event.inputs.force == 'true'
        run: |
          if [ -f scripts/generate_golden_post.py ]; then
            python scripts/generate_golden_post.py data/daily.json golden_output.png
          fi

      - name: Post to Telegram
        if: steps.market.outputs.market_open == 'true' || github.event.inputs.force == 'true'
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          python scripts/post_to_telegram.py

      - name: Post to Instagram
        if: steps.market.outputs.market_open == 'true' || github.event.inputs.force == 'true'
        env:
          FB_PAGE_TOKEN: ${{ secrets.FB_PAGE_TOKEN }}
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
        run: |
          python scripts/post_to_instagram.py || echo "Instagram post skipped"

      - name: Commit generated files
        if: always()
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          git add output.png golden_output.png data/*.json 2>/dev/null || true
          git diff --cached --quiet || git commit -m "Update Rased generated posts"
          git push || true

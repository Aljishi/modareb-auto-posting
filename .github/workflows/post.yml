name: Rased Auto Posting — راصد

on:
  workflow_dispatch: #
    inputs:
      job:
        description: "Which job to run?"
        required: true
        default: "auto-post"
        type: choice
        options:
          - auto-post
          - golden-signal
          - golden-confirmation
          - track-results
          - weekly-report
          - market-brief

      force:
        description: "Force run even if market closed?"
        required: false
        default: "false"
        type: boolean

  schedule: #
    # جميع أوقات GitHub Actions بتوقيت UTC.
    # توقيت السعودية = UTC +3.

    # الإشارات العادية:
    - cron: "5 7 * * 0-4"          # 10:05 صباحًا بتوقيت السعودية
    - cron: "35 7 * * 0-4"         # 10:35 صباحًا بتوقيت السعودية
    - cron: "30 8 * * 0-4"         # 11:30 صباحًا بتوقيت السعودية
    - cron: "30 9 * * 0-4"         # 12:30 ظهرًا بتوقيت السعودية
    - cron: "30 10 * * 0-4"        # 13:30 بتوقيت السعودية
    - cron: "30 11 * * 0-4"        # 14:30 بتوقيت السعودية

    # الإشارة الذهبية:
    - cron: "30 6 * * 0-4"         # 09:30 صباحًا بتوقيت السعودية
    - cron: "30 7 * * 0-4"         # تأكيد الذهبية 10:30 صباحًا

    # المتابعة والتقارير:
    - cron: "0 11 * * 0-4"         # متابعة الأداء 14:00
    - cron: "45 12 * * 0-4"        # التقرير اليومي 15:45
    - cron: "0 14 * * 4"           # التقرير الأسبوعي الخميس 17:00

permissions:
  contents: write

env:
  TZ: Asia/Riyadh
  PYTHONIOENCODING: utf-8
  PYTHONUNBUFFERED: "1"

jobs:
  auto-post:
    runs-on: ubuntu-latest

    concurrency:
      group: rased-auto-post
      cancel-in-progress: false

    if: >
      github.event.schedule == '5 7 * * 0-4' ||
      github.event.schedule == '35 7 * * 0-4' ||
      github.event.schedule == '30 8 * * 0-4' ||
      github.event.schedule == '30 9 * * 0-4' ||
      github.event.schedule == '30 10 * * 0-4' ||
      github.event.schedule == '30 11 * * 0-4' ||
      (github.event_name == 'workflow_dispatch' &&
       github.event.inputs.job == 'auto-post')

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install openai pandas requests pillow arabic-reshaper python-bidi

      - name: Create data folder
        run: mkdir -p data

      - name: Check market status
        id: market
        run: |
          python scripts/is_market_open.py \
            && echo "open=true" >> "$GITHUB_OUTPUT" \
            || echo "open=false" >> "$GITHUB_OUTPUT"

      - name: Skip if market closed
        if: >
          steps.market.outputs.open == 'false' &&
          github.event.inputs.force != 'true'
        run: |
          echo "ℹ️ السوق مغلق — لن يتم جلب البيانات أو توليد الإشارات"

      - name: Fetch Sahmk market data
        if: >
          steps.market.outputs.open == 'true' ||
          github.event.inputs.force == 'true'
        env:
          API_KEY: ${{ secrets.API_KEY }}
          API_URL: ${{ secrets.API_URL }}
          SAHMK_MAX_RETRIES: "4"
          SAHMK_RETRY_DELAY: "3"
          SAHMK_MAX_RETRY_DELAY: "60"
          SAHMK_REQUEST_GAP: "1.25"
          SAHMK_BATCH_SIZE: "15"
          SAHMK_MIN_ACCEPTED_STOCKS: "15"
        run: python scripts/market_intelligence.py

      - name: Data quality gate
        if: >
          steps.market.outputs.open == 'true' ||
          github.event.inputs.force == 'true'
        run: python scripts/data_quality_gate.py

      - name: Update self-learning model
        if: >
          steps.market.outputs.open == 'true' ||
          github.event.inputs.force == 'true'
        run: |
          python scripts/self_learning_engine.py \
            || echo "⚠️ Self-learning skipped"

      - name: Generate signals
        if: >
          steps.market.outputs.open == 'true' ||
          github.event.inputs.force == 'true'
        env:
          API_KEY: ${{ secrets.API_KEY }}
          API_URL: ${{ secrets.API_URL }}
        run: |
          python scripts/generate_signal.py 2>&1 | tee data/generation.log

      - name: Update sector rotation
        if: >
          steps.market.outputs.open == 'true' ||
          github.event.inputs.force == 'true'
        run: |
          python scripts/sector_rotation.py \
            || echo "⚠️ Sector rotation skipped"

      - name: Check if signals exist
        id: signal_check
        if: >
          steps.market.outputs.open == 'true' ||
          github.event.inputs.force == 'true'
        run: |
          python - << 'PY'
          import json
          import os
          from pathlib import Path

          signals_file = Path("data/signals.json")
          has_signals = False
          count = 0

          try:
              if signals_file.exists():
                  data = json.loads(
                      signals_file.read_text(encoding="utf-8")
                  )

                  if isinstance(data, list):
                      signals = data
                  elif isinstance(data, dict):
                      signals = data.get("signals", [])
                  else:
                      signals = []

                  if not isinstance(signals, list):
                      signals = []

                  count = len(signals)
                  has_signals = count > 0
              else:
                  print("No signals.json file was generated.")

          except Exception as exc:
              print(f"No valid signals.json: {exc}")

          print(f"Signals found: {count}")

          with open(
              os.environ["GITHUB_OUTPUT"],
              "a",
              encoding="utf-8",
          ) as output:
              output.write(
                  f"has_signals={'true' if has_signals else 'false'}\n"
              )
              output.write(f"count={count}\n")
          PY

      - name: Build rejection report if no signals
        if: >
          (steps.market.outputs.open == 'true' ||
           github.event.inputs.force == 'true') &&
          steps.signal_check.outputs.has_signals != 'true'
        run: python scripts/rejection_report.py

      - name: Post no-signal report if no signals
        if: >
          (steps.market.outputs.open == 'true' ||
           github.event.inputs.force == 'true') &&
          steps.signal_check.outputs.has_signals != 'true'
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python scripts/post_no_signal_report.py

      - name: Stop cleanly if no signals
        if: >
          (steps.market.outputs.open == 'true' ||
           github.event.inputs.force == 'true') &&
          steps.signal_check.outputs.has_signals != 'true'
        run: |
          echo "ℹ️ لا توجد إشارات اليوم — تم نشر ملخص أسباب الرفض"

      - name: OpenAI signal review
        if: >
          (steps.market.outputs.open == 'true' ||
           github.event.inputs.force == 'true') &&
          steps.signal_check.outputs.has_signals == 'true'
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENAI_MODEL: ${{ secrets.OPENAI_MODEL }}
        run: |
          python scripts/ai_signal_reviewer.py \
            || echo "⚠️ OpenAI unavailable — continue with Python gate"

      - name: Validate signal quality
        id: validate
        if: >
          (steps.market.outputs.open == 'true' ||
           github.event.inputs.force == 'true') &&
          steps.signal_check.outputs.has_signals == 'true'
        run: python scripts/should_post.py
        continue-on-error: true

      - name: Check validated signal count
        id: valid_check
        if: >
          (steps.market.outputs.open == 'true' ||
           github.event.inputs.force == 'true') &&
          steps.signal_check.outputs.has_signals == 'true'
        run: |
          python - << 'PY'
          import json
          import os
          from pathlib import Path

          validated_file = Path("data/validated_signals.json")
          count = 0

          try:
              if validated_file.exists():
                  data = json.loads(
                      validated_file.read_text(encoding="utf-8")
                  )

                  if isinstance(data, list):
                      signals = data
                  elif isinstance(data, dict):
                      signals = data.get(
                          "validated_signals",
                          data.get("signals", []),
                      )
                  else:
                      signals = []

                  if not isinstance(signals, list):
                      signals = []

                  count = len(signals)
              else:
                  print("No validated_signals.json file was generated.")

          except Exception as exc:
              print(f"No valid validated_signals.json: {exc}")

          print(f"Validated signals: {count}")

          with open(
              os.environ["GITHUB_OUTPUT"],
              "a",
              encoding="utf-8",
          ) as output:
              output.write(
                  f"has_valid={'true' if count > 0 else 'false'}\n"
              )
              output.write(f"count={count}\n")
          PY

      - name: Build rejection report if no valid signal
        if: >
          (steps.market.outputs.open == 'true' ||
           github.event.inputs.force == 'true') &&
          steps.signal_check.outputs.has_signals == 'true' &&
          steps.valid_check.outputs.has_valid != 'true'
        run: python scripts/rejection_report.py

      - name: Post no-signal report if no valid signal
        if: >
          (steps.market.outputs.open == 'true' ||
           github.event.inputs.force == 'true') &&
          steps.signal_check.outputs.has_signals == 'true' &&
          steps.valid_check.outputs.has_valid != 'true'
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python scripts/post_no_signal_report.py

      - name: Stop cleanly if no valid signal
        if: >
          (steps.market.outputs.open == 'true' ||
           github.event.inputs.force == 'true') &&
          steps.signal_check.outputs.has_signals == 'true' &&
          steps.valid_check.outputs.has_valid != 'true'
        run: |
          echo "ℹ️ لا توجد إشارات مجازة للنشر — تم نشر أسباب الرفض"

      - name: Generate post image
        if: >
          (steps.market.outputs.open == 'true' ||
           github.event.inputs.force == 'true') &&
          steps.valid_check.outputs.has_valid == 'true'
        run: |
          python scripts/generate_post.py \
            data/validated_signals.json \
            output.png

      - name: Post to Telegram
        if: >
          (steps.market.outputs.open == 'true' ||
           github.event.inputs.force == 'true') &&
          steps.valid_check.outputs.has_valid == 'true'
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python scripts/post_to_telegram.py

      - name: Log published signal
        if: >
          (steps.market.outputs.open == 'true' ||
           github.event.inputs.force == 'true') &&
          steps.valid_check.outputs.has_valid == 'true'
        run: python scripts/log_published_signal.py

      - name: Generate portfolio allocation
        if: >
          (steps.market.outputs.open == 'true' ||
           github.event.inputs.force == 'true') &&
          steps.valid_check.outputs.has_valid == 'true'
        run: python scripts/portfolio_engine.py

      - name: Update central database
        if: >
          (steps.market.outputs.open == 'true' ||
           github.event.inputs.force == 'true') &&
          steps.valid_check.outputs.has_valid == 'true'
        run: python scripts/rased_database.py

      - name: Build subscriber dashboard
        if: >
          (steps.market.outputs.open == 'true' ||
           github.event.inputs.force == 'true') &&
          steps.valid_check.outputs.has_valid == 'true'
        run: python scripts/dashboard_builder.py

      - name: Commit auto-post updates
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email \
            "github-actions[bot]@users.noreply.github.com"

          git add data/ docs/ output.png 2>/dev/null || true

          git diff --cached --quiet \
            || git commit -m \
              "راصد — تحديث إشارة $(date +'%H:%M')"

          git pull --rebase || true
          git push || true
        continue-on-error: true

  golden-signal:
    runs-on: ubuntu-latest

    concurrency:
      group: rased-golden-signal
      cancel-in-progress: false

    if: >
      github.event.schedule == '30 6 * * 0-4' ||
      (github.event_name == 'workflow_dispatch' &&
       github.event.inputs.job == 'golden-signal')

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pandas numpy requests pillow arabic-reshaper python-bidi

      - name: Create data folder
        run: mkdir -p data

      - name: Fetch Sahmk market data
        env:
          API_KEY: ${{ secrets.API_KEY }}
          API_URL: ${{ secrets.API_URL }}
          SAHMK_MAX_RETRIES: "4"
          SAHMK_RETRY_DELAY: "3"
          SAHMK_MAX_RETRY_DELAY: "60"
          SAHMK_REQUEST_GAP: "1.25"
          SAHMK_BATCH_SIZE: "15"
          SAHMK_MIN_ACCEPTED_STOCKS: "15"
        run: |
          python scripts/market_intelligence.py \
            || echo "⚠️ تعذر تحديث البيانات؛ ستُستخدم آخر بيانات محفوظة"

      - name: Generate pre-market golden signal 09:30
        env:
          API_KEY: ${{ secrets.API_KEY }}
          API_URL: ${{ secrets.API_URL }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENAI_MODEL: ${{ secrets.OPENAI_MODEL }}
          GOLDEN_RUN_MODE: premarket
          REQUIRE_OPENAI_FOR_GOLDEN: "true"
        run: python scripts/golden_signal_analysis.py

      - name: Check golden signal count
        id: golden_check
        run: |
          python - << 'PY'
          import json
          import os
          from pathlib import Path

          golden_file = Path("data/golden_signals.json")
          count = 0

          try:
              if golden_file.exists():
                  data = json.loads(
                      golden_file.read_text(encoding="utf-8")
                  )

                  if isinstance(data, list):
                      signals = data
                  elif isinstance(data, dict):
                      signals = data.get(
                          "golden_signals",
                          data.get("signals", []),
                      )
                  else:
                      signals = []

                  if isinstance(signals, list):
                      count = len(signals)

          except Exception as exc:
              print(f"Invalid golden_signals.json: {exc}")

          print(f"Golden signals found: {count}")

          with open(
              os.environ["GITHUB_OUTPUT"],
              "a",
              encoding="utf-8",
          ) as output:
              output.write(
                  f"found={'true' if count > 0 else 'false'}\n"
              )
              output.write(f"count={count}\n")
          PY

      - name: Stop cleanly if no golden signal
        if: steps.golden_check.outputs.found != 'true'
        run: |
          echo "ℹ️ لا توجد إشارة ذهبية قبل الافتتاح"

      - name: Generate golden image
        if: steps.golden_check.outputs.found == 'true'
        run: |
          python scripts/generate_golden_post.py \
            data/golden_signals.json \
            golden_output.png

      - name: Post golden signal to Telegram
        if: steps.golden_check.outputs.found == 'true'
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python scripts/post_golden_signal.py

      - name: Log published golden signal
        if: steps.golden_check.outputs.found == 'true'
        run: |
          python scripts/log_published_signal.py \
            || echo "⚠️ Log skipped"

      - name: Commit golden updates
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email \
            "github-actions[bot]@users.noreply.github.com"

          git add data/ golden_output.png 2>/dev/null || true

          git diff --cached --quiet \
            || git commit -m \
              "راصد — إشارة ذهبية 09:30 $(date +'%H:%M')"

          git pull --rebase || true
          git push || true
        continue-on-error: true

  golden-confirmation:
    runs-on: ubuntu-latest

    concurrency:
      group: rased-golden-confirmation
      cancel-in-progress: false

    if: >
      github.event.schedule == '30 7 * * 0-4' ||
      (github.event_name == 'workflow_dispatch' &&
       github.event.inputs.job == 'golden-confirmation')

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pandas numpy requests pillow arabic-reshaper python-bidi

      - name: Create data folder
        run: mkdir -p data

      - name: Fetch Sahmk market data after open
        env:
          API_KEY: ${{ secrets.API_KEY }}
          API_URL: ${{ secrets.API_URL }}
          SAHMK_MAX_RETRIES: "4"
          SAHMK_RETRY_DELAY: "3"
          SAHMK_MAX_RETRY_DELAY: "60"
          SAHMK_REQUEST_GAP: "1.25"
          SAHMK_BATCH_SIZE: "15"
          SAHMK_MIN_ACCEPTED_STOCKS: "15"
        run: |
          python scripts/market_intelligence.py \
            || echo "⚠️ تعذر تحديث البيانات؛ ستُستخدم آخر بيانات محفوظة"

      - name: Confirm or cancel golden signal 10:30
        env:
          API_KEY: ${{ secrets.API_KEY }}
          API_URL: ${{ secrets.API_URL }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENAI_MODEL: ${{ secrets.OPENAI_MODEL }}
          GOLDEN_RUN_MODE: confirmation
          REQUIRE_OPENAI_FOR_GOLDEN: "true"
        run: python scripts/golden_signal_analysis.py

      - name: Check confirmation output
        id: confirm_check
        run: |
          python - << 'PY'
          import json
          import os
          from pathlib import Path

          golden_file = Path("data/golden_signals.json")
          count = 0

          try:
              if golden_file.exists():
                  data = json.loads(
                      golden_file.read_text(encoding="utf-8")
                  )

                  if isinstance(data, list):
                      signals = data
                  elif isinstance(data, dict):
                      signals = data.get(
                          "golden_signals",
                          data.get("signals", []),
                      )
                  else:
                      signals = []

                  if isinstance(signals, list):
                      count = len(signals)

          except Exception as exc:
              print(f"Invalid golden_signals.json: {exc}")

          print(f"Golden confirmation messages: {count}")

          with open(
              os.environ["GITHUB_OUTPUT"],
              "a",
              encoding="utf-8",
          ) as output:
              output.write(
                  f"found={'true' if count > 0 else 'false'}\n"
              )
              output.write(f"count={count}\n")
          PY

      - name: Stop cleanly if no confirmation message
        if: steps.confirm_check.outputs.found != 'true'
        run: |
          echo "ℹ️ لا توجد إشارة ذهبية سابقة للتأكيد"

      - name: Generate golden confirmation image
        if: steps.confirm_check.outputs.found == 'true'
        run: |
          python scripts/generate_golden_post.py \
            data/golden_signals.json \
            golden_output.png

      - name: Post golden confirmation to Telegram
        if: steps.confirm_check.outputs.found == 'true'
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python scripts/post_golden_signal.py

      - name: Commit confirmation updates
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email \
            "github-actions[bot]@users.noreply.github.com"

          git add data/ golden_output.png 2>/dev/null || true

          git diff --cached --quiet \
            || git commit -m \
              "راصد — تأكيد الذهبية 10:30 $(date +'%H:%M')"

          git pull --rebase || true
          git push || true
        continue-on-error: true

  track-results:
    runs-on: ubuntu-latest

    concurrency:
      group: rased-track-results
      cancel-in-progress: false

    if: >
      github.event.schedule == '0 11 * * 0-4' ||
      (github.event_name == 'workflow_dispatch' &&
       github.event.inputs.job == 'track-results')

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pandas requests

      - name: Track signal performance
        env:
          API_KEY: ${{ secrets.API_KEY }}
          API_URL: ${{ secrets.API_URL }}
        run: python scripts/track_signal_performance.py

      - name: Update self-learning model
        run: |
          python scripts/self_learning_engine.py \
            || echo "⚠️ Self-learning skipped"

      - name: Update sector rotation
        run: |
          python scripts/sector_rotation.py \
            || echo "⚠️ Sector rotation skipped"

      - name: Generate portfolio allocation
        run: |
          python scripts/portfolio_engine.py \
            || echo "⚠️ Portfolio skipped"

      - name: Update central database
        run: |
          python scripts/rased_database.py \
            || echo "⚠️ Database skipped"

      - name: Build subscriber dashboard
        run: |
          python scripts/dashboard_builder.py \
            || echo "⚠️ Dashboard skipped"

      - name: Commit performance updates
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email \
            "github-actions[bot]@users.noreply.github.com"

          git add data/ docs/ 2>/dev/null || true

          git diff --cached --quiet \
            || git commit -m \
              "راصد — تحديث أداء الإشارات $(date +'%H:%M')"

          git pull --rebase || true
          git push || true
        continue-on-error: true

  weekly-report:
    runs-on: ubuntu-latest

    concurrency:
      group: rased-weekly-report
      cancel-in-progress: false

    if: >
      github.event.schedule == '0 14 * * 4' ||
      (github.event_name == 'workflow_dispatch' &&
       github.event.inputs.job == 'weekly-report')

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pandas requests

      - name: Update performance before weekly report
        env:
          API_KEY: ${{ secrets.API_KEY }}
          API_URL: ${{ secrets.API_URL }}
        run: python scripts/track_signal_performance.py

      - name: Update self-learning model
        run: |
          python scripts/self_learning_engine.py \
            || echo "⚠️ Self-learning skipped"

      - name: Update sector rotation
        run: |
          python scripts/sector_rotation.py \
            || echo "⚠️ Sector rotation skipped"

      - name: Generate portfolio allocation
        run: |
          python scripts/portfolio_engine.py \
            || echo "⚠️ Portfolio skipped"

      - name: Update central database
        run: |
          python scripts/rased_database.py \
            || echo "⚠️ Database skipped"

      - name: Build subscriber dashboard
        run: |
          python scripts/dashboard_builder.py \
            || echo "⚠️ Dashboard skipped"

      - name: Generate weekly report
        run: python scripts/weekly_report.py

      - name: Post weekly report to Telegram
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python scripts/post_weekly_report.py

      - name: Commit weekly report updates
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email \
            "github-actions[bot]@users.noreply.github.com"

          git add data/ docs/ 2>/dev/null || true

          git diff --cached --quiet \
            || git commit -m \
              "راصد — التقرير الأسبوعي $(date +'%H:%M')"

          git pull --rebase || true
          git push || true
        continue-on-error: true

  market-brief:
    runs-on: ubuntu-latest

    concurrency:
      group: rased-market-brief
      cancel-in-progress: false

    if: >
      github.event.schedule == '45 12 * * 0-4' ||
      (github.event_name == 'workflow_dispatch' &&
       github.event.inputs.job == 'market-brief')

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install requests

      - name: Create data folder
        run: mkdir -p data

      - name: Fetch Sahmk market data for daily brief
        env:
          API_KEY: ${{ secrets.API_KEY }}
          API_URL: ${{ secrets.API_URL }}
          SAHMK_MAX_RETRIES: "4"
          SAHMK_RETRY_DELAY: "3"
          SAHMK_MAX_RETRY_DELAY: "60"
          SAHMK_REQUEST_GAP: "1.25"
          SAHMK_BATCH_SIZE: "15"
          SAHMK_MIN_ACCEPTED_STOCKS: "15"
        run: |
          python scripts/market_intelligence.py \
            || echo "⚠️ تعذر تحديث البيانات؛ ستُستخدم آخر بيانات محفوظة"

      - name: Generate daily market brief
        run: python scripts/generate_market_brief.py

      - name: Post daily market brief to Telegram
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python scripts/post_market_brief_to_telegram.py

      - name: Commit market brief updates
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email \
            "github-actions[bot]@users.noreply.github.com"

          git add data/ docs/ 2>/dev/null || true

          git diff --cached --quiet \
            || git commit -m \
              "راصد — التقرير اليومي للسوق $(date +'%H:%M')"

          git pull --rebase || true
          git push || true
        continue-on-error: true
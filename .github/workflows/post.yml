name: Rased Auto Posting

on:
  schedule:
    # Run every 5 minutes during Saudi market hours
    # Saudi time: 10:00-14:55 (Sunday-Thursday)
    # UTC time: 07:00-11:55 (Sunday-Thursday)
    # Note: GitHub Actions uses UTC
    - cron: "*/5 7-11 * * 0-4"
  
  # Allow manual trigger for testing
  workflow_dispatch:

jobs:
  check-market:
    runs-on: ubuntu-latest
    timezone: "Asia/Riyadh"
    outputs:
      is_market_open: ${{ steps.market-check.outputs.is_open }}
      market_status: ${{ steps.market-check.outputs.status }}
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pytz

      - name: Check Saudi Market Status
        id: market-check
        run: |
          python scripts/is_market_open.py
          echo "is_open=true" >> $GITHUB_OUTPUT
          echo "status=Market is open" >> $GITHUB_OUTPUT

  post:
    needs: check-market
    runs-on: ubuntu-latest
    timezone: "Asia/Riyadh"
    if: needs.check-market.result == 'success'
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: 📊 Fetch Market Data
        run: |
          echo "🚀 Starting Data Fetch..."
          python scripts/fetch_api_data.py
          
      - name: 🤖 Generate Signal
        run: |
          echo "🚀 Starting Signal Generation..."
          python scripts/generate_signal.py
          
      - name: ✅ Check if should post
        run: |
          echo "🚀 Checking posting conditions..."
          python scripts/should_post.py
          
      - name: 🎨 Generate Post Image
        run: |
          echo "🚀 Generating Post Image..."
          python scripts/generate_post.py
          
      - name: 📢 Post to Telegram
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          echo "🚀 Starting Telegram Post..."
          python scripts/post_to_telegram.py
          
      - name: 📘 Post to Facebook
        env:
          FB_APP_ID: ${{ secrets.FB_APP_ID }}
          FB_APP_SECRET: ${{ secrets.FB_APP_SECRET }}
          FB_PAGE_ID: ${{ secrets.FB_PAGE_ID }}
          FB_PAGE_TOKEN: ${{ secrets.FB_PAGE_TOKEN }}
        run: |
          echo "🚀 Starting Facebook Post..."
          python scripts/post_to_facebook.py
          
      - name: 📸 Post to Instagram
        env:
          IG_APP_ID: ${{ secrets.IG_APP_ID }}
          IG_APP_SECRET: ${{ secrets.IG_APP_SECRET }}
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
        run: |
          echo "🚀 Starting Instagram Post..."
          python scripts/post_to_instagram.py

  market-closed:
    needs: check-market
    runs-on: ubuntu-latest
    if: needs.check-market.result == 'failure'
    
    steps:
      - name: Log market closed status
        run: |
          echo "❌ Saudi market is closed. Skipping posting."
          echo "The workflow only runs Sunday-Thursday, 10:00-15:00 KSA"
          echo "Also checks for Saudi public holidays"
          exit 0

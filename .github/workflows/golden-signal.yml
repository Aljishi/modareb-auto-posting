name:  Golden Signal Generator

on:
  # التشغيل اليدوي
  workflow_dispatch:
  
  # التشغيل عند push لبيانات معينة
  push:
    paths:
      - 'data/golden_signal.json'
      - 'scripts/historical_analyzer.py'
      - 'scripts/generate_golden_post.py'
    branches:
      - main
  
  # الجدولة الزمنية (قبل السوق)
  schedule:
    - cron: '10 6 * * 0-4'  # 9:10 AM Riyadh time (أحد-خميس)
    - cron: '55 6 * * 0-4'  # 9:55 AM Riyadh time (أحد-خميس)

jobs:
  generate-golden-signal:
    name: 🎯 Generate Golden Signal
    runs-on: ubuntu-latest
    timeout-minutes: 15
    
    steps:
      - name: 📥 Checkout repository
        uses: actions/checkout@v4
      
      - name: 🐍 Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'
      
      - name: 📦 Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install requests pillow pandas numpy
      
      - name: 📊 Run Historical Analyzer
        id: analyzer
        run: |
          echo "🔍 Running historical analysis on TASI stocks..."
          python scripts/historical_analyzer.py
        env:
          API_KEY: ${{ secrets.API_KEY }}
          API_URL: ${{ secrets.API_URL }}
      
      - name: 📁 Check if golden signal exists
        id: check_signal
        run: |
          if [ -f "data/golden_signal.json" ]; then
            echo "signal_exists=true" >> $GITHUB_OUTPUT
            echo "✅ Golden signal file found"
          else
            echo "signal_exists=false" >> $GITHUB_OUTPUT
            echo "⚠️ No golden signal generated"
          fi
      
      - name: 🎨 Generate Golden Image
        if: steps.check_signal.outputs.signal_exists == 'true'
        run: |
          echo "🎨 Generating golden signal image..."
          python scripts/generate_golden_post.py data/golden_signal.json output_golden.png
        env:
          PYTHONUTF8: 1
      
      - name: 📸 Upload Golden Image Artifact
        if: steps.check_signal.outputs.signal_exists == 'true'
        uses: actions/upload-artifact@v3
        with:
          name: golden-signal-image
          path: output_golden.png
          retention-days: 7
      
      - name: 📤 Commit and push golden signal data
        if: steps.check_signal.outputs.signal_exists == 'true'
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add data/golden_signal.json
          git commit -m "🌟 Update golden signal - $(date +'%Y-%m-%d %H:%M')" || echo "No changes to commit"
          git push
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      
      - name: 📢 Post to Telegram (Optional)
        if: steps.check_signal.outputs.signal_exists == 'true' && secrets.TELEGRAM_BOT_TOKEN
        run: |
          echo "📤 Posting to Telegram..."
          python scripts/post_to_telegram.py --golden --image output_golden.png
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          PYTHONUTF8: 1
      
      - name: ✅ Job Summary
        if: always()
        run: |
          echo "## 🌟 Golden Signal Job Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Status:** ${{ job.status }}" >> $GITHUB_STEP_SUMMARY
          echo "**Time:** $(date)" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          if [ "${{ steps.check_signal.outputs.signal_exists }}" == "true" ]; then
            echo "✅ Golden signal generated successfully" >> $GITHUB_STEP_SUMMARY
            echo "📊 Image uploaded as artifact" >> $GITHUB_STEP_SUMMARY
          else
            echo "⚠️ No golden signal was generated" >> $GITHUB_STEP_SUMMARY
          fi

name: Test API Connection

on:
  workflow_dispatch:

jobs:
  test-api:
    runs-on: ubuntu-latest
    
    steps:
      - uses: actions/checkout@v4
      
      - name: Test Sahmk API
        run: |
          echo "🧪 Testing Sahmk API..."
          
          if [ -z "$API_KEY" ]; then
            echo "❌ API_KEY not configured"
            exit 1
          fi
          
          # Test connection
          response=$(curl -s -w "\n%{http_code}" \
            -H "Authorization: Bearer $API_KEY" \
            -H "Accept: application/json" \
            "$API_URL/market/stocks")
          
          http_code=$(echo "$response" | tail -n1)
          body=$(echo "$response" | sed '$d')
          
          echo "HTTP Status: $http_code"
          
          case $http_code in
            200)
              echo "✅ API is working perfectly!"
              echo "📊 Sample data:"
              echo "$body" | jq '.stocks[0]' 2>/dev/null || echo "$body" | head -10
              ;;
            401)
              echo "❌ Invalid API Key"
              echo "Please check your API_KEY in Secrets"
              exit 1
              ;;
            403)
              echo "❌ API Key expired or insufficient permissions"
              exit 1
              ;;
            404)
              echo "❌ API endpoint not found"
              echo "Check API_URL: $API_URL"
              exit 1
              ;;
            *)
              echo "⚠️ Unexpected error: $http_code"
              echo "$body"
              exit 1
              ;;
          esac
        env:
          API_KEY: ${{ secrets.API_KEY }}
          API_URL: ${{ secrets.API_URL }}

